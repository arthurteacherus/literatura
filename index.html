<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8" />
<title>Конструктор уроков литературы</title>
<link rel="stylesheet" href="vendor/fonts/fonts.css" />
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#1E2530; --muted:#66707E; --faint:#9AA6B2;
  --line:#DFE3E9; --accent:#132c53; --accent-soft:#E7ECF5; --accent-soft2:#DCE4F2;
  --neg:#C1554B; --neg-soft:#FBEDEB; --gold:#C98A2B; --gold-soft:#FBF3E4;
  --radius:14px; --radius-sm:9px; --shadow:0 1px 2px rgba(19,44,83,.06), 0 6px 20px rgba(19,44,83,.08);
  --shadow-lg:0 20px 60px rgba(19,44,83,.28);
  --font-body:'PT Sans','Segoe UI',Arial,sans-serif;
  --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:inherit}
::selection{background:#c9d8f2}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.appwrap{max-width:1220px;margin:0 auto;padding:0 20px 90px}

header.top{position:sticky;top:0;z-index:30;background:rgba(238,241,245,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -20px 18px;padding:12px 20px}
.top-row{max-width:1220px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:8px}
.brand img.mark{width:36px;height:36px;border-radius:10px;flex:none;background:var(--accent)}
.brand h1{font-family:var(--font-display);font-size:19px;font-weight:700;margin:0;letter-spacing:-.2px;color:var(--accent)}
.brand p{margin:0;font-size:11px;color:var(--muted)}

.topnav{display:inline-flex;background:#E2E7EF;padding:4px;border-radius:11px;gap:4px;flex-wrap:wrap}
.topnav button{border:none;background:transparent;padding:9px 16px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.topnav button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
.btn:hover{background:#F4F6F9;border-color:#CBD2DC}
.btn svg{width:15px;height:15px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0d1f3d}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.gold:hover{background:#B27723}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{background:#E4E9F0;color:var(--ink)}
.btn.danger:hover{color:var(--neg);background:var(--neg-soft)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chip{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.chip .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.chip .x{opacity:.55}
.chip .x:hover{opacity:1}
.chip.locked{padding-right:10px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:transparent;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

.viewtoggle{display:inline-flex;background:#E2E7EF;padding:4px;border-radius:10px;gap:4px}
.viewtoggle button{border:none;background:transparent;padding:7px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.viewtoggle button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{font-family:var(--font-display);font-size:15.5px;margin:0;font-weight:700}
.panel-body{padding:14px 16px}

.searchbar{display:flex;align-items:center;gap:8px;flex:1;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.searchbar input{border:none;outline:none;background:transparent;flex:1;font-size:13.5px}
.searchbar svg{width:15px;height:15px;color:var(--faint);flex:none}

.toolbar{position:sticky;top:0;background:var(--bg);z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;cursor:pointer;transition:transform .1s,box-shadow .1s;display:flex;flex-direction:column;gap:8px;min-height:118px}
.card.hasbox{position:relative}
.card.hasbox .ct-title,.card.hasbox .ct-preview{padding-right:24px}
.card .selbox{position:absolute;top:10px;right:10px;width:18px;height:18px;cursor:pointer;margin:0}
.card.sel{outline:2px solid var(--accent);background:var(--accent-soft)}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(19,44,83,.12), 0 12px 30px rgba(19,44,83,.10)}
.card .ct-title{font-family:var(--font-display);font-weight:700;font-size:15.5px;line-height:1.3}
.card .ct-sub{font-size:12px;color:var(--muted)}
.card .ct-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.card .ct-preview{font-size:12.5px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.group-h{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--accent);margin:20px 0 10px;padding-top:6px;border-top:1px solid var(--line)}
.group-h:first-child{margin-top:0;border-top:none;padding-top:0}

.empty{text-align:center;padding:52px 24px;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--radius);background:var(--surface)}

.addbox{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#F4F6F9;border:1px solid var(--line);border-radius:11px;padding:11px}
.addbox input,.addbox select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}

.tk-row{display:flex;align-items:center;gap:8px;padding:6px 4px}
.tk-dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tk-name{flex:1;border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;font-weight:600;min-width:0}
.tk-name:hover{border-color:var(--line)} .tk-name:focus{border-color:var(--line);background:var(--surface)}
.pal{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 4px 24px;padding:10px;background:#F4F6F9;border:1px solid var(--line);border-radius:10px}
.pal .sw{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.pal .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}

/* ---- Overlay / Modal ---- */
.overlay{position:fixed;inset:0;background:rgba(19,44,83,.42);display:flex;justify-content:center;align-items:flex-start;padding:36px 16px;overflow:auto;z-index:100}
.modal{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:980px;overflow:hidden;margin:auto}
.modal.wide{max-width:1280px}
.pm-menu{position:absolute;z-index:60;top:100%;left:0;margin-top:4px;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:4px}
.pm-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:600}
.pm-item:hover{background:var(--accent-soft)}
.pm-item.sel{background:var(--accent-soft);color:var(--accent)}
.pm-item .pm-hint{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--faint)}
.pm-sep{height:1px;background:var(--line);margin:4px 2px}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-family:var(--font-display);font-size:19px;margin:0;flex:1}
.modal-body{padding:18px 20px;max-height:78vh;overflow:auto}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:#F9FAFC}

/* ---- Rich editor ---- */
.editorwrap{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.edtoolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:#F9FAFC}
.edtoolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.toolbtn{border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;font-size:13px;font-weight:700;color:var(--ink);min-width:30px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.toolbtn:hover{background:var(--accent-soft);border-color:var(--accent-soft)}
.toolbtn.active{background:var(--accent-soft);color:var(--accent)}
.toolselect{border:1px solid var(--line);border-radius:7px;padding:5px 6px;font-size:12.5px;background:var(--surface)}
.hlrow{display:flex;gap:4px;align-items:center;padding:0 4px}
.hlsw{width:19px;height:19px;border-radius:5px;border:1px solid rgba(0,0,0,.12);cursor:pointer}

.editor-area{padding:16px 18px;min-height:200px;max-height:56vh;overflow:auto;font-size:14.5px;line-height:1.7}
.editor-area:focus{outline:none}
.editor-area table{border-collapse:collapse;width:100%;margin:10px 0}
.editor-area td,.editor-area th{border:1px solid var(--line);padding:6px 8px}
.editor-area.compact{min-height:110px;max-height:34vh}

.lc-block{margin:12px 0;position:relative;border:1px solid var(--line);border-radius:10px;padding:8px;background:#F9FAFC}
.lc-block img,.lc-block video{max-width:100%;border-radius:6px;display:block}
.lc-block audio,.lc-block video{width:100%}
.lc-block .blk-name{font-size:11.5px;color:var(--muted);margin-top:6px}
.lc-block .blk-del{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:6px;width:24px;height:24px;display:none;align-items:center;justify-content:center;color:var(--neg)}
.lc-block:hover .blk-del{display:flex}

.lc-note{border-radius:2px}
.lc-note.note-highlight{background:#FBF3E4;border-bottom:2px solid var(--gold)}
.lc-qa-anchor{border-radius:2px}
.lc-qa-anchor.qa-highlight{background:#FBE1DE;color:var(--neg);box-shadow:0 0 0 2px #F3B7B1}
.notes-hidden .lc-note.note-highlight{background:transparent;border-bottom:none}
.notes-hidden .lc-qa-anchor.qa-highlight{background:transparent;box-shadow:none;color:inherit}

/* ---- Ход урока panel ---- */
.course-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.course-grid>*:first-child{position:sticky;top:16px}
/* .panel обычно ставит overflow:hidden (чтобы скруглить углы) — это ломает прилипание
   текста внутри карточки урока, поэтому у той конкретной панели его снимаем. */
.panel-sticky-host{overflow:visible}
.sticky{position:relative;background:#FFF1A8;border:1px solid #E6D470;border-radius:3px 3px 14px 3px;box-shadow:2px 3px 7px rgba(0,0,0,.16);padding:7px 28px 7px 10px;margin:6px 0;transform:rotate(-.35deg);max-width:560px}
.sticky textarea{width:100%;border:none;background:transparent;font-family:"Segoe Print","Segoe Script","Comic Sans MS",cursive;font-size:13px;line-height:1.4;color:#4a3d00;padding:0;outline:none}
.sticky .sticky-x{position:absolute;top:3px;right:5px;border:none;background:transparent;color:#8a7a2a;font-size:12px;padding:2px 4px;border-radius:4px}
.sticky .sticky-x:hover{background:rgba(0,0,0,.08)}
.split-pane{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,1fr);gap:14px;min-height:320px}
.split-pane>*{min-height:0;overflow:auto}
.split-pane .editor-area{max-height:none;min-height:0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.split-right{padding-right:4px}
@media (max-width:900px){.split-pane{grid-template-columns:1fr;height:auto!important}.split-pane>*{overflow:visible}}
.lc-qa-anchor.qa-active{background:#FBE1DE;color:var(--neg);box-shadow:0 0 0 2px #F3B7B1}
a[href^="litfile:"]{cursor:pointer;color:var(--accent);text-decoration:underline}
a[href^="litfile:"]::before{content:"⬇ ";text-decoration:none;display:inline-block}
@media (max-width:980px){.course-grid{grid-template-columns:1fr}.course-grid>*:first-child{position:static}}
.qrow{border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:8px;background:var(--surface);transition:background .1s,border-color .1s}
.qrow:hover,.qrow.hovered{background:var(--accent-soft);border-color:var(--accent-soft2)}
.qrow .qtext{font-weight:600;font-size:13.5px;flex:1}
.qrow .qmeta{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.noterow{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:8px 10px;margin-bottom:8px;background:var(--gold-soft);font-size:13px}

/* ---- Календарь / журнал ---- */
.monthcard,.weekcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.weekcard.thisweek{border-color:var(--accent)}
.wc-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:#F9FAFC}
.wc-head .wl{font-family:var(--font-display);font-weight:700;font-size:13.5px}
.wc-head .tw{font-size:10.5px;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:20px}
.wdhead{display:grid;grid-template-columns:repeat(7,1fr);background:#F9FAFC;border-bottom:1px solid var(--line)}
.wdhead div{padding:8px;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600}
.daygrid,.mgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.daycol{border-right:1px solid var(--line);min-height:96px;padding:7px 7px 28px;position:relative}
.daycol:last-child{border-right:none}
.mcell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:86px;padding:5px 5px 22px;position:relative}
.daycol.today,.mcell.today{background:var(--gold-soft)}
.daycol.vac,.mcell.vac{background:repeating-linear-gradient(45deg,#EFEBE1,#EFEBE1 7px,#F4F1E9 7px,#F4F1E9 14px)}
.mcell.out{background:#FAFAF9;opacity:.6}
.daycol .dnum,.mcell .dnum{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}
.vaclabel{font-size:9.5px;color:#8A7A55;background:#F4EFE2;border:1px solid #E4D9BF;border-radius:5px;padding:1px 5px;margin-bottom:4px;display:inline-block}
.lchip{border-left:3px solid var(--lc,#888);background:#F7F8F7;border-radius:6px;padding:5px 7px;margin-bottom:5px;font-size:11.5px;line-height:1.3;cursor:pointer}
.lchip:hover{background:#EFF2EF}
.lchip.done{opacity:.6}
.lchip .lt{font-weight:600;display:flex;align-items:center;gap:5px}
.lchip .lt .tx.done{text-decoration:line-through}
.lchip .lmeta{color:var(--muted);font-size:10px;margin-top:1px}
.lcheck{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center;background:var(--surface);font-size:9px;font-weight:900;color:#fff}
.lcheck.done{background:var(--accent);border-color:var(--accent)}
.addmini{position:absolute;bottom:5px;left:6px;right:6px;border:1px dashed var(--line);border-radius:7px;color:var(--faint);font-size:11px;padding:2px;text-align:center;background:transparent;opacity:0;transition:opacity .12s;cursor:pointer}
.daycol:hover .addmini,.mcell:hover .addmini{opacity:1}
.stcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:10px}
.st-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
.st-head input.st-name{border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 7px;font-weight:700;font-size:14.5px;min-width:100px}
.qavgs{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;align-items:center}
.qb{display:inline-flex;flex-direction:column;align-items:center;font-size:9.5px;color:var(--faint);min-width:42px}
.qb .qval{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--ink);line-height:1.2}
.qb .qval.filled{padding:1px 7px;border-radius:6px;color:#fff}
.qb.year .qval{border:2px solid var(--ink);padding:1px 7px;border-radius:6px}
.st-body{padding:0 14px 14px;border-top:1px solid var(--line)}
.markpill{display:inline-flex;align-items:center;gap:6px;background:#F7F8F7;border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:12px}
.jwrap{overflow-x:auto;margin-bottom:22px}
.jtable{border-collapse:collapse;font-size:13.5px;border:2px solid var(--ink)}
.jtable th,.jtable td{border:1.5px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap}
.jtable thead th{background:#F9FAFC;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--faint)}
.jtable td.jname{text-align:left;font-weight:700;cursor:default;white-space:nowrap}
.jtable td.jcell{cursor:pointer;padding:3px}
.jtable tr.jrow-hover td{background:var(--accent-soft)}
.jtable td.jcell.jcol-done,.jtable th.jcol-done{background:#e4e7eb}
.jtable td.jcell.jcol-hover,.jtable th.jcol-hover{background:var(--accent-soft)}
.jdonecheck{cursor:pointer;margin-left:3px;vertical-align:middle}
.jwrap{max-width:100%}
.jtable th.jsn,.jtable td.jsn{position:sticky;left:0;z-index:2;min-width:40px;width:40px;box-sizing:border-box;background:var(--surface)}
.jtable th.jsf,.jtable td.jsf{position:sticky;left:40px;z-index:2;background:var(--surface);box-shadow:2px 0 0 #aebdcc;text-align:left}
.jtable thead th.jsn,.jtable thead th.jsf{z-index:3;background:#F9FAFC}
.jtable td.jposted,.jtable th.jposted{background:#e3e5e8}
.jinput{width:58px;text-align:center;font-weight:700;font-size:14px;padding:5px 2px;border-radius:6px;border:1.5px solid #d3dde7;background:#fff}
.jinput.bad{border-color:#c0392b}
.jinput.changed{border-color:#3b82c4;background:#f2f8fe}
.jpill{display:inline-flex;min-width:28px;height:28px;padding:0 4px;border-radius:6px;color:#fff;font-weight:700;align-items:center;justify-content:center;font-size:13px}
.jempty{color:#c3ceda}
.jbulk{cursor:pointer;opacity:.6;margin-left:2px}
.jdatenum{cursor:pointer;text-decoration:underline dotted}
.jdatenum:hover{color:var(--accent)}
.jbulk:hover{opacity:1}
.seatboard{background:var(--ink);color:#fff;text-align:center;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:8px;border-radius:8px;margin-bottom:16px}
.seatcols{display:flex;gap:16px}
.seatcol{flex:1;display:grid;gap:6px;align-content:start;min-width:0}
.seatrow-label{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.deskrow{display:flex;gap:4px;align-items:center}
.deskno{font-size:10px;color:#b3bec9;width:12px;text-align:right;flex:none}
.deskseats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;min-width:0}
.seat{border-radius:7px;min-height:30px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;padding:5px 7px;cursor:pointer;background:#f6f8fb;border:1.5px dashed #b9c6d4;color:#93a2b1;min-width:0}
.seat.filled{background:#fff;border:1.5px solid var(--accent-soft2);color:var(--ink);cursor:grab;justify-content:space-between}
.seat .seatname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .x{cursor:pointer;color:var(--neg);font-weight:900;flex:none}
.seatinput{border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12.5px;min-height:30px;box-sizing:border-box;min-width:0;width:100%}
.unseated-strip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1px dashed var(--line);border-radius:10px;margin-bottom:16px;background:var(--gold-soft)}
.unseated-chip{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:grab}
.markpill .mv{width:20px;height:20px;border-radius:5px;color:#fff;font-weight:700;display:grid;place-items:center;font-size:12px}

/* ---- Misc ---- */
.badge-lock{font-size:10px;color:var(--faint)}
.muted{color:var(--muted)}
.hint{font-size:11.5px;color:var(--faint)}
.row{display:flex;align-items:center;gap:8px}
.row.wrap{flex-wrap:wrap}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--faint);margin-bottom:5px;font-weight:600}
.field{margin-bottom:12px}
.titleinput{font-family:var(--font-display);font-size:22px;font-weight:700;border:1px solid transparent;border-radius:8px;padding:6px 8px;width:100%;background:transparent}
.titleinput:hover{border-color:var(--line)} .titleinput:focus{border-color:var(--line);background:var(--surface)}

#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:20px}
.gate img{width:96px;height:96px;border-radius:22px}
.gate h1{font-family:var(--font-display);font-size:26px;margin:0;color:var(--accent)}
